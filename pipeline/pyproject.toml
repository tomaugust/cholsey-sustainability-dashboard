[project]
name = "cholsey-pipeline"
version = "0.1.0"
description = "Data ingestion, geographic join and export pipeline for the Cholsey Parish Sustainability Dashboard"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "requests>=2.32",
    "openpyxl>=3.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cholsey_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
