# Geographic scope for the Cholsey Parish Sustainability Dashboard.
#
# Loaded and validated by pipeline/src/cholsey_pipeline/registry.py::load_geography.
# Source of truth: docs/technical-specification.md §2.
#
# Required fields (enforced by the loader): name, role
#   role: subject | comparator | district | national
#
# IMPORTANT — comparator parishes are REAL codes but UNCONFIRMED by the
# project lead: P1.3 (2026-09-28) computed which parishes actually touch
# Cholsey's polygon against live ONS boundary data (not the spec's
# name-only candidate list, which turned out to have two real errors --
# see docs/decisions/0003-comparator-parish-selection.md and Q-009 in
# STATUS.md). Every comparator below carries pending_confirmation: true
# until that ADR is accepted or amended by Tom. Do not clear the flag
# without his answer landing in STATUS.md's Q-009 row first.

areas:
  # --- Subject parish (confirmed, spec §2) ---
  E04012474:
    name: Cholsey
    role: subject
    area_km2: 16.52
    population_2021_census: 4498
    postcode_district: OX10
    notes: >
      Sits across parts of more than one LSOA (see below). Confirm the exact
      LSOA-to-parish overlap via the ONS Output Area to Parish lookup before
      aggregating any LSOA-level dataset (spec §2, plan P1.4).

  # --- Comparator parishes: real codes, computed by ADR-0003 (P1.3), ---
  # --- UNCONFIRMED pending Q-009. All 8 genuinely touch Cholsey's     ---
  # --- polygon (live ONS data). The 4 marked "spec §2" were also in   ---
  # --- the spec's original candidate list; the other 4 are real      ---
  # --- neighbours the spec's list missed or mis-stated — see the ADR.---
  E04012496:
    name: Wallingford
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). In spec §2's original candidate list."
  E04008148:
    name: Moulsford
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). In spec §2's original candidate list."
  E04008163:
    name: South Stoke
    role: comparator
    pending_confirmation: true
    notes: >
      Touches Cholsey (verified). In spec §2's original candidate list.
      CAUTION: there are two different parishes named "South Stoke" in
      the live ONS data (E04008163 here, and E04009876 elsewhere) — this
      is the correct one, selected by adjacency, not by name.
  E04012473:
    name: Brightwell-cum-Sotwell
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). In spec §2's original candidate list."
  E04008102:
    name: Aston Tirrold
    role: comparator
    pending_confirmation: true
    notes: >
      Touches Cholsey (verified). spec §2 listed "Aston Tirrold & Aston
      Upthorpe" as one candidate, but they are two separate parishes —
      only Aston Tirrold actually touches Cholsey. Aston Upthorpe
      (E04008103) does not and is deliberately NOT included here.
  E04001147:
    name: Aldworth
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). NOT in spec §2's original candidate list — found by P1.3's adjacency computation."
  E04008118:
    name: Crowmarsh
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). NOT in spec §2's original candidate list — found by P1.3's adjacency computation."
  E04012494:
    name: South Moreton
    role: comparator
    pending_confirmation: true
    notes: "Touches Cholsey (verified). NOT in spec §2's original candidate list — found by P1.3's adjacency computation."

  # --- District (confirmed, spec §2) ---
  E07000179:
    name: South Oxfordshire
    role: district

  # --- National benchmark (Q-003 resolution: England is the default) ---
  E92000001:
    name: England
    role: national
    notes: >
      Default national comparator (Q-003, resolved 2026-09-27). Fall back to
      Great Britain or UK only where a specific dataset has no England-level
      figure, and record the level actually used in that row's provenance
      (development-plan.md §3 P3.7, risk R7).

# LSOAs the parish overlaps, per spec §2 — not areas in their own right for
# benchmarking, but needed by the geographic join (Phase 1/3) to apportion
# LSOA-level datasets (electricity, gas) onto the Cholsey parish polygon.
lsoas:
  E01035751:
    name: "South Oxfordshire 015H"
    parish: E04012474
  E01028619:
    name: "South Oxfordshire 015B"
    parish: E04012474

msoas:
  E02005972:
    name: "South Oxfordshire 015"

wards:
  E05011701:
    name: Cholsey
    parish: E04012474

# County and region — not benchmark levels per spec §2 (district/national are
# the two above the parish), kept here only for reference and future joins.
# Deliberately NOT under `areas:` (which load_geography validates against the
# subject/comparator/district/national role enum, none of which fits these).
reference_geographies:
  E10000025:
    name: Oxfordshire
    kind: county
  E12000008:
    name: South East
    kind: region
