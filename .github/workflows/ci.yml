name: CI

# Runs the project's real, fast checks on every PR and every push to the
# default branch — see docs/development-plan.md §5.1 and CLAUDE.md's
# "never skip, disable or weaken a test to get green" rule. This wires the
# same `make test` / `make lint` a contributor runs locally (P0.6) into
# Actions; it doesn't duplicate their logic.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: Pipeline (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.x"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: pipeline
        run: uv sync
      - name: Run tests
        working-directory: pipeline
        run: uv run pytest
      - name: Lint (ruff check)
        working-directory: pipeline
        run: uv run ruff check .
      - name: Lint (ruff format --check)
        working-directory: pipeline
        run: uv run ruff format --check .

  web:
    name: Web (vitest + astro check + eslint/prettier + playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test
      - name: Build (astro check + astro build)
        working-directory: web
        run: npm run build
      - name: Lint (eslint + prettier)
        working-directory: web
        run: npm run lint
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Playwright, against the built site)
        working-directory: web
        run: npm run test:e2e

  links:
    name: Links (lychee over the built site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Build site
        working-directory: web
        run: npm ci && npm run build
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir ${{ github.workspace }}/web/dist 'web/dist/**/*.html'
          fail: true
